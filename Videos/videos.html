  <style>

<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4" id="videoGallery">

</div>

    <video src="30.mp4" onclick="showVideo(this.src)" class="w-full h-48 object-cover rounded-xl cursor-pointer shadow hover:shadow-lg transition" playsinline muted preload="metadata"></video>
    
     
  const videos = [
    "videos/video1.mp4",
    "videos/video2.mp4",
    "videos/video3.mp4",
    // ... add up to video30.mp4
  ];

  const videoGrid = document.getElementById("videoGrid");

  videos.forEach(src => {
    const vid = document.createElement("video");
    vid.src = src;
    vid.className = "w-full rounded-lg shadow cursor-pointer";
    vid.setAttribute("playsinline", "");
    vid.setAttribute("controls", "");
    vid.onclick = () => showVideo(src);
    videoGrid.appendChild(vid);
  });

  function showVideo(src) {
    const modal = document.getElementById("videoModal");
    const modalVideo = document.getElementById("modalVideo");
    modalVideo.src = src;
    modal.classList.remove("hidden");
    document.body.classList.add("modal-open");
    modalVideo.play();
  }

  function closeVideo() {
    const modal = document.getElementById("videoModal");
    const modalVideo = document.getElementById("modalVideo");
    modalVideo.pause();
    modalVideo.src = "";
    modal.classList.add("hidden");
    document.body.classList.remove("modal-open");
  }
</script>


  <!-- Fullscreen Video Modal -->
  <div id="videoModal" onclick="closeVideoModal()" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90">
    <video id="modalVideo" class="max-w-full max-h-full rounded shadow-2xl" playsinline controls></video>
  </div>

</body>
</html>
