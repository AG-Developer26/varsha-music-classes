<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.modal-open {
      overflow: hidden;
    }
  </style>
  <script>
    function showVideo(src) {
      const modal = document.getElementById('videoModal');
      const modalVideo = document.getElementById('modalVideo');
      modalVideo.src = src;
      modal.classList.remove('hidden');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const modalVideo = document.getElementById('modalVideo');
      modal.classList.add('hidden');
      modalVideo.pause();
      modalVideo.src = "";
      document.body.classList.remove('modal-open');
    }

    window.onload = function() {
      const container = document.getElementById('videoGrid');
      for (let i = 1; i <= 30; i++) {
        let div = document.createElement('div');
        div.className = "cursor-pointer";
        div.onclick = () => showVideo(`videos/{i}.mp4`);

        div.innerHTML = `
          <video class="rounded-lg shadow-lg w-full" muted playsinline preload="metadata">
            <source src="Videos/${i}.mp4" type="video/mp4">
          </video>
        `;

        container.appendChild(div);
      }
    }
  </script>
</head>
<body class="bg-gray-100">

  <div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-center">Video Gallery</h1>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black bg-opacity-90 flex justify-center items-center z-50">
    <div class="relative w-11/12 md:w-3/4 lg:w-2/3">
      <button onclick="closeModal()" class="absolute top-2 right-2 text-white text-3xl">&times;</button>
      <video id="modalVideo" controls autoplay playsinline class="w-full rounded-lg shadow-xl"></video>
    </div>
  </div>

</body>
</html>
