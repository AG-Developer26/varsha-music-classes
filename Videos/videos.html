<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.modal-open {
      overflow: hidden;
    }
  </style>
  <script>
    // ✅ Put your video file names here
    const videoFiles = [
      "1.mp4,"2.mp4, "3.mp4","4.mp4","5.mp4","6.mp4","7.mp4","8.mp4","9.mp4","10.mp4",
  "11.mp4","12.mp4","13.mp4","14.mp4","15.mp4","16.mp4","17.mp4","18.mp4","19.mp4","20.mp4",
  "21.mp4","22.mp4","23.mp4","24.mp4","25.mp4","26.mp4","27.mp4","28.mp4","29.mp4","30.mp4"
      // 👉 keep adding until all 30 are listed
    ];

    function showVideo(src) {
      const modal = document.getElementById('videoModal');
      const modalVideo = document.getElementById('modalVideo');
      modalVideo.src = src;
      modal.classList.remove('hidden');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const modalVideo = document.getElementById('modalVideo');
      modal.classList.add('hidden');
      modalVideo.pause();
      modalVideo.src = "";
      document.body.classList.remove('modal-open');
    }

    window.onload = function() {
      const container = document.getElementById('videoGrid');
      videoFiles.forEach(file => {
        let div = document.createElement('div');
        div.className = "cursor-pointer";
        div.onclick = () => showVideo(file);

        div.innerHTML = `
          <video class="rounded-lg shadow-lg w-full" muted playsinline preload="metadata">
            <source src="${file}" type="video/mp4">
          </video>
        `;

        container.appendChild(div);
      });
    }
  </script>
</head>
<body class="bg-gray-100">

  <div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6 text-center">Video Gallery</h1>

    <!-- Video Grid -->
    <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="videoModal" class="hidden fixed inset-0 bg-black bg-opacity-90 flex justify-center items-center z-50">
    <div class="relative w-11/12 md:w-3/4 lg:w-2/3">
      <button onclick="closeModal()" class="absolute top-2 right-2 text-white text-3xl">&times;</button>
      <video id="modalVideo" controls autoplay playsinline class="w-full rounded-lg shadow-xl"></video>
    </div>
  </div>

</body>
</html>
