<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Video Gallery</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body.modal-open { overflow: hidden; }

</style>
</head>
<body class="bg-gray-100 p-6">
 <div class="container mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold text-center mb-10">Student Video Gallery</h1>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4" id="videoGallery">
  <!-- Thumbnails will be generated here -->
</div>

<!-- Fullscreen Video Modal -->
<div id="videoModal" onclick="closeVideoModal()" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90">
  <video id="modalVideo" class="max-w-full max-h-full rounded shadow-2xl" controls></video>
</div>

<script>
const videoFiles = [
  "2.mp4","4.mp4","5.mp4","6.mp4","7.mp4","8.mp4","9.mp4","10.mp4",
  "11.mp4","12.mp4","13.mp4","14.mp4","15.mp4","16.mp4","17.mp4","18.mp4","19.mp4","20.mp4",
  "21.mp4","22.mp4","23.mp4","24.mp4","25.mp4","26.mp4","27.mp4","28.mp4","29.mp4","30.mp4"
];

const gallery = document.getElementById("videoGallery");

videoFiles.forEach(src => {
  const tempVideo = document.createElement("video");
  tempVideo.src = src;
  tempVideo.preload = "metadata";
  tempVideo.muted = true;

  tempVideo.addEventListener("loadeddata", () => {
    tempVideo.currentTime = 1; // capture frame at 1 second
  });

  tempVideo.addEventListener("seeked", () => {
    const canvas = document.createElement("canvas");
    canvas.width = tempVideo.videoWidth;
    canvas.height = tempVideo.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(tempVideo, 0, 0);

    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/jpeg");
    img.className = "w-full h-48 object-cover rounded-xl cursor-pointer shadow hover:shadow-lg transition";
    img.onclick = () => showVideo(src);

    gallery.appendChild(img);
  });
});

function showVideo(src) {
  document.getElementById("modalVideo").src = src;
  document.getElementById("videoModal").classList.remove("hidden");
  document.body.classList.add("modal-open");
}

function closeVideoModal() {
  document.getElementById("modalVideo").pause();
  document.getElementById("videoModal").classList.add("hidden");
  document.body.classList.remove("modal-open");
}
</script>
 <!-- Fullscreen Video Modal -->
  <div id="videoModal" onclick="closeVideoModal()" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90">
    <video id="modalVideo" class="max-w-full max-h-full rounded shadow-2xl" controls></video>
  </div>
</body>
</html>
